name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: "postgresql://opina:opina@localhost:5432/opina_test?schema=public"
  AUTH_SECRET: "ci-test-secret-not-for-production"
  S3_ENDPOINT: "http://localhost:9000"
  S3_REGION: "us-east-1"
  S3_BUCKET: "opina-images"
  S3_ACCESS_KEY_ID: "opina"
  S3_SECRET_ACCESS_KEY: "opina123"
  S3_PUBLIC_URL: "http://localhost:9000/opina-images"
  # El CI no levanta MinIO: las imágenes se guardan en memoria (como en .env.test).
  IMAGE_STORAGE: "memory"

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opina
          POSTGRES_PASSWORD: opina
          POSTGRES_DB: opina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar migraciones (BD de pruebas)
        run: npx prisma migrate deploy

      - name: Sembrar datos de prueba
        run: npm run prisma:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitarios e integración
        run: npm test

      - name: Build
        run: npm run build

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests end-to-end
        run: npm run test:e2e

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # APK de depuración (HU-16). Informativo: NO es un check requerido de `main` (tarda varios
  # minutos y no debe bloquear cambios ajenos a la app). Apunta al servidor de Vercel por HTTPS.
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Interfaz estática y sincronización de Capacitor
        run: npm run build:mobile

      - name: Plataforma de Android 36 (si el ejecutor no la trae)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar la APK de depuración
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir la APK
        uses: actions/upload-artifact@v4
        with:
          name: opina-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # La aplicación en un contenedor: construye la imagen, la arranca con PostgreSQL y MinIO y
  # comprueba /api/health (aplica las migraciones al arrancar). No publica nada.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir y arrancar con Docker Compose
        run: docker compose --profile app up -d --build --wait --wait-timeout 240

      - name: Prueba de humo (/api/health)
        run: curl -fsS http://localhost:3000/api/health

      - name: Registros del contenedor (si algo falla)
        if: failure()
        run: docker compose --profile app logs --no-color app

      - name: Parar y limpiar
        if: always()
        run: docker compose --profile app down -v
